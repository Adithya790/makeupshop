{% extends 'base.html' %}

{% block content %}

<style>

.success-container{
    max-width:600px;
    margin:80px auto;
    background:#fff;
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 8px 30px rgba(0,0,0,0.08);
}

.success-icon{
    font-size:70px;
    margin-bottom:15px;
}

.success-container h1{
    color:#28a745;
    margin-bottom:15px;
}

.success-container p{
    color:#666;
    font-size:16px;
    margin-bottom:30px;
}

.track-btn{
    display:inline-block;
    padding:14px 35px;
    background:linear-gradient(135deg,#ff4d6d,#ff758f);
    color:white;
    text-decoration:none;
    border-radius:50px;
    font-size:16px;
    font-weight:600;
    letter-spacing:0.5px;
    transition:all 0.3s ease;
    box-shadow:0 8px 20px rgba(255,77,109,0.3);
}

.track-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 25px rgba(255,77,109,0.4);
}

</style>

<div class="success-container">

    <div class="success-icon">
        ✅
    </div>

    <h1>Order Placed Successfully!</h1>

    <p>
        Thank you for shopping with us.
        Your order has been confirmed.
    </p>

    <a href="{% url 'track_order' order.id %}" class="track-btn">
        📦 Track Your Order
    </a>

</div>

{% endblock %}
