{% extends 'base.html' %}

{% block content %}

<style>

.track-container{
    max-width:1000px;
    margin:50px auto;
    padding:20px;
}

.track-title{
    text-align:center;
    font-size:32px;
    color:#333;
    margin-bottom:30px;
}

.order-card{
    background:#fff;
    border-radius:15px;
    padding:25px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
    margin-bottom:50px;
}

.order-card p{
    margin:12px 0;
    font-size:17px;
    color:#555;
}

.order-card strong{
    color:#222;
}

.timeline{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
}

.step{
    text-align:center;
}

.circle{
    width:60px;
    height:60px;
    border-radius:50%;
    background:#ddd;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:22px;
    font-weight:bold;
    margin:auto;
}

.step.active .circle{
    background:#28a745;
}

.step p{
    margin-top:10px;
    font-size:14px;
    font-weight:600;
}

.line{
    width:120px;
    height:5px;
    background:#ddd;
    margin:0 10px;
}

.line.active{
    background:#28a745;
}

.back-btn{
    display:block;
    width:220px;
    margin:40px auto 0;
    text-align:center;
    padding:14px;
    background:#ff4d6d;
    color:white;
    text-decoration:none;
    border-radius:10px;
    font-weight:600;
    transition:0.3s;
}

.back-btn:hover{
    background:#e63e5f;
    transform:translateY(-3px);
}

@media(max-width:768px){

    .timeline{
        flex-direction:column;
    }

    .line{
        width:5px;
        height:50px;
        margin:10px 0;
    }
}

</style>

<div class="track-container">

    <h1 class="track-title">
        📦 Track Your Order
    </h1>

    <div class="order-card">

        <p><strong>Order ID:</strong> #{{ order.id }}</p>

        <p><strong>Payment Method:</strong> {{ order.payment_id }}</p>

        <p><strong>Status:</strong> {{ order.status }}</p>

    </div>

    <div class="timeline">

        <div class="step active">
            <div class="circle">✓</div>
            <p>Confirmed</p>
        </div>

        <div class="line {% if order.status == 'Shipped' or order.status == 'Out for Delivery' or order.status == 'Delivered' %}active{% endif %}"></div>

        <div class="step {% if order.status == 'Shipped' or order.status == 'Out for Delivery' or order.status == 'Delivered' %}active{% endif %}">
            <div class="circle">✓</div>
            <p>Shipped</p>
        </div>

        <div class="line {% if order.status == 'Out for Delivery' or order.status == 'Delivered' %}active{% endif %}"></div>

        <div class="step {% if order.status == 'Out for Delivery' or order.status == 'Delivered' %}active{% endif %}">
            <div class="circle">✓</div>
            <p>Out For Delivery</p>
        </div>

        <div class="line {% if order.status == 'Delivered' %}active{% endif %}"></div>

        <div class="step {% if order.status == 'Delivered' %}active{% endif %}">
            <div class="circle">✓</div>
            <p>Delivered</p>
        </div>

    </div>

    <a href="/" class="back-btn">
        Continue Shopping
    </a>

</div>

{% endblock %}
