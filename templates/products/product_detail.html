{% extends 'base.html' %}

{% block title %}
{{ product.name }} | Makeup Store
{% endblock %}

{% block content %}

<section class="container">

    <div class="product-detail-card">

        <div class="detail-image">
            <img src="{{ product.image.url }}"
                 alt="{{ product.name }}">
        </div>

        <div class="detail-info">

            <p class="brand">{{ product.brand }}</p>

            <h1>{{ product.name }}</h1>

            <p class="detail-price">
                ₹{{ product.price }}
            </p>

            <p class="description">
                {{ product.description }}
            </p>

            <p>
                <strong>Stock:</strong>
                {{ product.stock }}
            </p>

            <div class="action-buttons">

                <a href="{% url 'add_to_cart' product.id %}" class="add-cart-btn">
    Add to Cart
</a>
  <a href="{% url 'add_to_wishlist' product.id %}" class="add-cart-btn">
    ❤️ Wishlist
</a>

                <a href="/"
                   class="btn-outline">
                    Back to Shop
                </a>

            </div>

        </div>

    </div>

</section>

{% endblock %}
