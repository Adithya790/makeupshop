{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    background:#fff5f7;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:40px;
}

.create-account-box{

    width:100%;
    max-width:500px;

    background:white;

    padding:50px;

    border-radius:25px;

    box-shadow:0 10px 40px rgba(0,0,0,0.08);
}

.create-account-box h1{

    font-size:40px;

    margin-bottom:10px;

    color:#111;
}

.subtitle{

    color:#777;

    margin-bottom:35px;
}

.form-group{

    margin-bottom:22px;
}

.form-group label{

    display:block;

    margin-bottom:10px;

    font-weight:600;
}

.form-control{

    width:100%;

    padding:16px;

    border:1px solid #ddd;

    border-radius:14px;

    outline:none;

    font-size:16px;

    background:#fafafa;
}

.form-control:focus{

    border-color:#ff3f6c;

    background:white;
}

.create-btn{

    width:100%;

    padding:18px;

    border:none;

    border-radius:14px;

    background:#ff3f6c;

    color:white;

    font-size:17px;

    font-weight:600;

    cursor:pointer;

    margin-top:10px;
}

.create-btn:hover{

    background:#e6325d;
}

.login-link{

    text-align:center;

    margin-top:25px;
}

.login-link a{

    color:#ff3f6c;

    text-decoration:none;

    font-weight:600;
}

.alert{

    background:#ffe4ec;

    color:#d81b60;

    padding:15px;

    border-radius:10px;

    margin-bottom:20px;
}

</style>

</head>

<body>

<div class="create-account-box">

    <h1>Create Account</h1>

    <p class="subtitle">

        Join our beauty shopping experience

    </p>

    {% if messages %}

        {% for message in messages %}

            <div class="alert">

                {{ message }}

            </div>

        {% endfor %}

    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">

            <label>Full Name</label>

            <input type="text"
                   name="username"
                   class="form-control"
                   placeholder="Enter your full name"
                   required>

        </div>

        <div class="form-group">

            <label>Email Address</label>

            <input type="email"
                   name="email"
                   class="form-control"
                   placeholder="Enter your email"
                   required>

        </div>

        <div class="form-group">

            <label>Phone Number</label>

            <input type="text"
                   name="phone"
                   class="form-control"
                   placeholder="Enter your phone number"
                   required>

        </div>

        <div class="form-group">

            <label>Password</label>

            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Create password"
                   required>

        </div>

        <div class="form-group">

            <label>Confirm Password</label>

            <input type="password"
                   name="confirm_password"
                   class="form-control"
                   placeholder="Confirm password"
                   required>

        </div>

        <button type="submit"
                class="create-btn">

            Create Account

        </button>

    </form>

    <div class="login-link">

        Already have an account?

        <a href="/login/">

            Login

        </a>

    </div>

</div>

</body>

</html>
